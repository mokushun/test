<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FX H1 Monitor</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 10px;
}
h1 {
    margin-bottom: 10px;
}
#grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}
.chartBox {
    border: 1px solid #ddd;
    padding: 5px;
}
.chartTitle {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 5px;
}
@media (max-width: 800px) {
    #grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>
<body>
<h1>H1 Charts</h1>
<div id="grid"></div>

<h1 style="margin-top:30px;">Currency Strength</h1>
<div id="strongGrid"></div>

<script>
const symbols = [
'US100','JP225','US500',
'USDJPY','EURUSD','EURJPY',
'USDCHF','AUDCHF','GBPCHF',
'GBPUSD','AUDUSD','CHFJPY'
];
const tf = "H1";

async function loadAll() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    for (const symbol of symbols) {
        const box = document.createElement("div");
        box.className = "chartBox";
        const title = document.createElement("div");
        title.className = "chartTitle";
        title.innerText = symbol + " " + tf;
        const chartDiv = document.createElement("div");
        chartDiv.style.height = "260px";
        box.appendChild(title);
        box.appendChild(chartDiv);
        grid.appendChild(box);
        try {
            const res = await fetch(symbol + "_" + tf + ".json");
            const data = await res.json();
            const chart = LightweightCharts.createChart(chartDiv, {
                height: 260,
                handleScroll: false,
                handleScale: false,
                layout: {
                    background: { color: '#ffffff' },
                    textColor: '#000'
                },
                grid: {
                    vertLines: { visible: false },
                    horzLines: { visible: false }
                },
                rightPriceScale: {
                    borderVisible: false
                },
                timeScale: {
                    borderVisible: false,
                    rightBarStaysOnScroll: false,
                    rightOffset: 0,
                    fixRightEdge: true
                }
            });
            const series = chart.addCandlestickSeries();
            const sliced = data.slice(-120);
            const candleData = sliced.map(d => ({
                time: Math.floor(new Date(d.x).getTime() / 1000),
                open: d.o,
                high: d.h,
                low: d.l,
                close: d.c
            }));
            series.setData(candleData);

            // 現在足（current:true）を薄い色で上書き
            const last = sliced[sliced.length - 1];
            if (last && last.current) {
                series.applyOptions({
                    lastValueVisible: true,
                });
                // 現在足だけ色を変えるため最後の1本を別シリーズで重ねる
                const curSeries = chart.addCandlestickSeries({
                    upColor: '#aaaaff',
                    downColor: '#ffaaaa',
                    borderUpColor: '#6666cc',
                    borderDownColor: '#cc6666',
                    wickUpColor: '#6666cc',
                    wickDownColor: '#cc6666',
                });
                curSeries.setData([candleData[candleData.length - 1]]);
            }
        } catch (err) {
            console.log("Error loading:", symbol, err);
        }
    }
}

// ---- 通貨強弱チャート ----
const STRONG_FILES = [
    { file: "strong_120.json",  label: "Short (gen=0.98)",  bars: 120 },
    { file: "strong_600.json",  label: "Mid   (gen=0.996)", bars: 120 },
    { file: "strong_2400.json", label: "Long  (gen=0.999)", bars: 120 },
];

const CURRENCY_COLORS = {
    USD: '#2196F3',
    JPY: '#F44336',
    EUR: '#4CAF50',
    GBP: '#9C27B0',
    AUD: '#FF9800',
    CHF: '#795548',
};

async function loadStrong() {
    const grid = document.getElementById("strongGrid");
    grid.style.display = "grid";
    grid.style.gridTemplateColumns = "repeat(3, 1fr)";
    grid.style.gap = "15px";
    grid.innerHTML = "";

    for (const cfg of STRONG_FILES) {
        const box = document.createElement("div");
        box.className = "chartBox";

        const title = document.createElement("div");
        title.className = "chartTitle";
        title.innerText = "Currency Strength " + cfg.label;

        // 凡例
        const legend = document.createElement("div");
        legend.style.fontSize = "11px";
        legend.style.marginBottom = "3px";
        for (const [cur, col] of Object.entries(CURRENCY_COLORS)) {
            const sp = document.createElement("span");
            sp.style.color = col;
            sp.style.marginRight = "8px";
            sp.style.fontWeight = "bold";
            sp.innerText = cur;
            legend.appendChild(sp);
        }

        const chartDiv = document.createElement("div");
        chartDiv.style.height = "260px";

        box.appendChild(title);
        box.appendChild(legend);
        box.appendChild(chartDiv);
        grid.appendChild(box);

        try {
            const res = await fetch(cfg.file);
            const data = await res.json();
            const sliced = data.slice(-cfg.bars);

            const chart = LightweightCharts.createChart(chartDiv, {
                height: 260,
                handleScroll: false,
                handleScale: false,
                layout: {
                    background: { color: '#ffffff' },
                    textColor: '#000'
                },
                grid: {
                    vertLines: { visible: false },
                    horzLines: { color: '#f0f0f0' }
                },
                rightPriceScale: { borderVisible: false },
                timeScale: {
                    borderVisible: false,
                    rightOffset: 0,
                    fixRightEdge: true
                }
            });

            for (const cur of ["USD", "JPY", "EUR", "GBP", "AUD", "CHF"]) {
                const lineSeries = chart.addLineSeries({
                    color: CURRENCY_COLORS[cur],
                    lineWidth: 1,
                    priceLineVisible: false,
                    lastValueVisible: false,
                    crosshairMarkerVisible: false,
                });
                const lineData = sliced.map(d => ({
                    time: Math.floor(new Date(d.t).getTime() / 1000),
                    value: d[cur]
                }));
                lineSeries.setData(lineData);
            }
        } catch (err) {
            console.log("Error loading strong:", cfg.file, err);
        }
    }
}

loadAll();
loadStrong();
</script>
</body>
</html>
