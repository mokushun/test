<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FX Monitor</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1b2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f5f6f8;--sf:#fff;--ink:#1b2430;--mute:#6b7685;--line:#e1e5ea;--gain:#1f6fd1;--loss:#d4432b;--a:#1f6fd1;--b:#e08a00}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--sf:#1a2028;--ink:#e8ecf1;--mute:#8f9aa8;--line:#2a323c;--gain:#5aa2f5;--loss:#ff7a5c;--a:#5aa2f5;--b:#f0a431}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main,header,nav{max-width:860px;margin:0 auto;padding-left:14px;padding-right:14px}
header{display:flex;align-items:center;gap:8px;padding-top:12px}
header h1{font-size:17px;margin:0;flex:1}
button,select{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:6px;padding:5px 12px}
.m{color:var(--mute);font-size:13px}
.g{color:var(--gain)}.l{color:var(--loss)}
#msg{padding:0 14px;max-width:860px;margin:2px auto;font-size:13px;color:var(--loss)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:8px}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--mute)}
nav button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
main{padding-bottom:40px}
.pane{display:none}.pane.on{display:block}
h2{font-size:14px;margin:22px 0 4px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px 16px;margin:16px 0}
.kpi span{display:block;color:var(--mute);font-size:12px}
.kpi b{font-size:19px}
.big{font-size:22px}
.r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.r>span:first-child{flex:1}
.pos{margin-top:8px;border-top:2px solid var(--ink)}
.pos .top{border-bottom:0}
.nm{font-size:18px}
.sub{padding-left:14px;font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:7px 0;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;font-size:13px}
.best{font-weight:700}
.ch{position:relative;height:220px;margin:4px 0 10px}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--sf);color:var(--ink);width:min(92vw,420px)}
dialog::backdrop{background:#0006}
dialog label{display:block;margin:12px 0;font-size:13px;color:var(--mute)}
dialog input{display:block;width:100%;margin-top:4px;padding:8px;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>FX Monitor</h1>
  <span class="m" id="upd"></span>
  <button id="rf" aria-label="更新">更新</button>
  <button id="st" aria-label="設定">設定</button>
</header>
<div id="msg"></div>
<nav>
  <button data-t="pos" class="on">ポジション</button>
  <button data-t="cmp">仲値比較</button>
  <button data-t="str">手法別</button>
</nav>
<main>
  <section id="pos" class="pane on"></section>
  <section id="cmp" class="pane">
    <div id="cmpT"></div>
    <h2>決済曜日別のPF</h2><div class="ch"><canvas id="c1"></canvas></div>
    <h2>決済曜日別の勝率（%）</h2><div class="ch"><canvas id="c2"></canvas></div>
    <h2>月別のPF</h2><div class="ch"><canvas id="c3"></canvas></div>
    <p class="m">損失が1件もない区間はPFを計算できないため、棒が出ません。件数が少ない区間は参考程度に見てください。</p>
  </section>
  <section id="str" class="pane">
    <p><select id="sel"></select></p>
    <div id="strK" class="kpi"></div>
    <h2>累積損益</h2><div class="ch"><canvas id="s1"></canvas></div>
    <h2>月別損益</h2><div class="ch"><canvas id="s2"></canvas></div>
    <div id="sw"><h2>決済曜日別損益</h2><div class="ch"><canvas id="s3"></canvas></div></div>
  </section>
</main>
<dialog id="dlg">
  <h2 style="margin-top:0">接続設定</h2>
  <label>データのURL<input id="u" placeholder="https://example.com/oanda/stats.json" autocapitalize="off" autocorrect="off"></label>
  <label>トークン<input id="t" type="password" autocomplete="off"></label>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button id="no">閉じる</button><button id="ok" class="pri">保存して取得</button>
  </div>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s), LS=localStorage;
let D=null, tab='pos', charts={};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const num=(v,d=0)=>v==null?'—':Number(v).toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=v=>v==null?'—':(v>0?'+':'')+num(v);
const cls=v=>v>0?'g':v<0?'l':'';
const pf=s=>s.pf!=null?s.pf.toFixed(2):(s.gp>0?'∞':'—');
const pct=v=>v==null?'—':v.toFixed(1)+'%';
const msg=t=>$('#msg').textContent=t;

function chart(id,type,labels,sets,y){
  if(charts[id])charts[id].destroy();
  const mu=css('--mute');
  charts[id]=new Chart($('#'+id),{type,data:{labels,datasets:sets},options:{
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:sets.length>1,labels:{color:mu,boxWidth:12}}},
    scales:{x:{ticks:{color:mu,maxTicksLimit:8},grid:{display:false}},y:{ticks:{color:mu},grid:{color:css('--line')},...y}}}});
}
const signColors=vs=>vs.map(v=>v>=0?css('--gain'):css('--loss'));

/* ---- ポジション ---- */
function rPos(){
  const p=D.positions, t=p.total;
  const lab=k=>(p.by_tag[k]||{}).label||k;
  let h=`<div class="kpi"><div><span>含み損益（合計）</span><b class="big ${cls(t.unrealized)}">${sgn(t.unrealized)}</b></div><div><span>保有</span><b>${t.n}件</b></div></div>`;
  h+='<h2>手法別</h2>'+Object.entries(p.by_tag).map(([k,v])=>
    `<div class="r"><span>${v.label}</span><span class="m">${v.n}件</span><b class="${cls(v.unrealized)}">${sgn(v.unrealized)}</b></div>`).join('');
  h+='<h2>通貨ペア別（含み損が大きい順）</h2>';
  h+=[...p.by_instrument].sort((a,b)=>a.unrealized-b.unrealized).map(r=>
    `<div class="pos"><div class="r top"><span><b class="nm">${r.instrument.replace('_','/')}</b> <span class="m">${r.side==='long'?'買':'売'} ${r.n}件・${num(r.units)}通貨・平均${r.avg_price}</span></span><b class="big ${cls(r.unrealized)}">${sgn(r.unrealized)}</b></div>`+
    Object.entries(r.by_tag).map(([k,v])=>`<div class="r sub"><span>${lab(k)}</span><span class="m">${v.n}件・${num(v.units)}通貨</span><b class="${cls(v.unrealized)}">${sgn(v.unrealized)}</b></div>`).join('')+'</div>').join('');
  $('#pos').innerHTML=h||'<p class="m">保有ポジションはありません</p>';
}

/* ---- 仲値比較 ---- */
function rCmp(){
  const A=D.strategies.NAKANE_BUY_SINCE||D.strategies.NAKANE_BUY, B=D.strategies.TEST_NAKANE_BUY;
  if(!A||!B){$('#cmpT').innerHTML='<p class="m">仲値2手法のデータがありません</p>';return;}
  const rng=s=>s.equity.length?s.equity[0][0].slice(5)+' 〜 '+s.equity[s.equity.length-1][0].slice(5):'—';
  const R=[ // [名前, 良い方向(1高い/-1低い/0なし), 比較値, 表示]
    ['期間（決済日）',0,()=>null,rng],
    ['件数',0,()=>null,s=>s.summary.n],
    ['PF',1,s=>s.summary.pf!=null?s.summary.pf:(s.summary.gp>0?1e9:null),s=>pf(s.summary)],
    ['勝率',1,s=>s.summary.win_rate,s=>pct(s.summary.win_rate)],
    ['平均pips',1,s=>s.summary.avg_pips,s=>num(s.summary.avg_pips,1)],
    ['1万通貨あたり損益',1,s=>s.summary.per10k,s=>sgn(s.summary.per10k)]];
  $('#cmpT').innerHTML=`<table><tr><th></th><th style="color:var(--a)">${A.label}</th><th style="color:var(--b)">${B.label}</th></tr>`+
    R.map(([n,d,v,f])=>{const a=v(A),b=v(B);let ca='',cb='';
      if(d&&a!=null&&b!=null&&a!==b){const aw=d>0?a>b:a<b;ca=aw?'best':'';cb=aw?'':'best';}
      return `<tr><td>${n}</td><td class="${ca}">${f(A)}</td><td class="${cb}">${f(B)}</td></tr>`;}).join('')+'</table>';
  const wd=[0,1,2,3,4,5,6].filter(i=>A.by_weekday[i].n||B.by_weekday[i].n), L=wd.map(i=>D.weekday_labels[i]);
  const two=(keys,get)=>[{label:A.label,data:keys.map(k=>get(A,k)),backgroundColor:css('--a')},{label:B.label,data:keys.map(k=>get(B,k)),backgroundColor:css('--b')}];
  chart('c1','bar',L,two(wd,(s,i)=>s.by_weekday[i].pf));
  chart('c2','bar',L,two(wd,(s,i)=>s.by_weekday[i].win_rate),{min:0,max:100});
  const ms=[...new Set([...Object.keys(A.by_month),...Object.keys(B.by_month)])].sort();
  chart('c3','bar',ms,two(ms,(s,m)=>s.by_month[m]?s.by_month[m].pf:null));
}

/* ---- 手法別 ---- */
function rStr(){
  const sel=$('#sel'), keep=sel.value;
  sel.innerHTML=Object.entries(D.strategies).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
  if(D.strategies[keep])sel.value=keep;
  const k=sel.value, S=D.strategies[k], m=S.summary;
  const un=k==='ALL'?D.positions.total.unrealized:(D.positions.by_tag[k]||{}).unrealized;
  const K=[['確定損益',sgn(m.net),cls(m.net)],['PF',pf(m)],['勝率',pct(m.win_rate)],['件数',num(m.n)],['平均pips',num(m.avg_pips,1)],['最大ドローダウン',num(m.max_dd)],['スワップ計',sgn(m.swap),cls(m.swap)]];
  if(un!=null)K.push(['含み損益',sgn(un),cls(un)],['確定＋含み',sgn(m.net+un),cls(m.net+un)]);
  $('#strK').innerHTML=K.map(([n,v,c])=>`<div><span>${n}</span><b class="${c||''}">${v}</b></div>`).join('');
  chart('s1','line',S.equity.map(e=>e[0]),[{data:S.equity.map(e=>e[1]),borderColor:css('--a'),borderWidth:2,pointRadius:0}]);
  const ms=Object.keys(S.by_month), mv=ms.map(x=>S.by_month[x].net);
  chart('s2','bar',ms,[{data:mv,backgroundColor:signColors(mv)}]);
  const show=S.show_weekday&&m.n>0;
  $('#sw').style.display=show?'':'none';
  if(show){const wd=[0,1,2,3,4,5,6].filter(i=>S.by_weekday[i].n), wv=wd.map(i=>S.by_weekday[i].net);
    chart('s3','bar',wd.map(i=>D.weekday_labels[i]),[{data:wv,backgroundColor:signColors(wv)}]);}
}

/* ---- 共通 ---- */
function render(){
  if(!D)return;
  const t=new Date(D.generated_at);
  $('#upd').textContent=t.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+' 更新';
  $('#upd').className='m '+(Date.now()-t>30*60e3?'l':'');
  ({pos:rPos,cmp:rCmp,str:rStr})[tab]();
}
async function load(){
  const url=LS.getItem('fx_url'), tok=LS.getItem('fx_tok')||'';
  if(!url){openDlg();return;}
  try{
    const r=await fetch(url,{headers:{Authorization:'Bearer '+tok},cache:'no-store'});
    if(r.status===401){msg('トークンが違います。設定を確認してください。');openDlg();return;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    D=await r.json();msg('');render();
  }catch(e){msg('取得に失敗しました（'+e.message+'）。URLと通信状態を確認してください。');}
}
function openDlg(){$('#u').value=LS.getItem('fx_url')||'';$('#t').value=LS.getItem('fx_tok')||'';$('#dlg').showModal();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===tab));
  render();});
$('#sel').onchange=render;
$('#rf').onclick=load;
$('#st').onclick=openDlg;
$('#no').onclick=()=>$('#dlg').close();
$('#ok').onclick=()=>{LS.setItem('fx_url',$('#u').value.trim());LS.setItem('fx_tok',$('#t').value.trim());$('#dlg').close();load();};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
setInterval(()=>{if(!document.hidden)load();},5*60e3);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',render);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
load();
</script>
</body>
</html>
