<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF.js 埋め込みサンプル</title>
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --accent-color: #4a6cf7;
            --text-color: #2b2f38;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        /* PDFコンテナ：PDF特有の無骨なビューアー感を排除し、Webのカードデザインに溶け込ませる */
        .pdf-viewer-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .pdf-canvas-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            background-color: #ffffff;
            min-height: 400px;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto !important;
        }

        /* カスタムコントロールバー：Webサイトのパーツとしてデザイン */
        .pdf-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #ffffff;
            border-top: 1px solid #f0f0f0;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: #f1f3f5;
            color: var(--text-color);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover:not(:disabled) {
            background: var(--accent-color);
            color: #ffffff;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 0.9rem;
            font-weight: 500;
            color: #6c757d;
        }

        /* ローディング表示 */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            color: var(--accent-color);
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">ドキュメントプレビュー</div>

    <!-- PDF表示カード -->
    <div class="pdf-viewer-card">
        <div class="pdf-canvas-container" id="canvas-container">
            <div class="loading-overlay" id="loading">読み込み中...</div>
            <canvas id="pdf-render"></canvas>
        </div>

        <!-- 自作の操作バー -->
        <div class="pdf-controls">
            <div class="btn-group">
                <button class="btn" id="prev-page" disabled>前へ</button>
                <button class="btn" id="next-page" disabled>次へ</button>
            </div>
            <div class="page-info">
                Page <span id="page-num">1</span> / <span id="page-count">-</span>
            </div>
        </div>
    </div>
</div>

<script>
    // Workerのパスを設定
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // 表示したいPDFファイルのURL（GitHub Pagesの相対パスなどを指定）
    const url = './pdf/sample.pdf'; 

    let pdfDoc = null,
        pageNum = 1,
        pageIsRendering = false,
        pageNumIsPending = null;

    const scale = 1.5, // 描画クオリティ（解像度）
        canvas = document.getElementById('pdf-render'),
        ctx = canvas.getContext('2d'),
        loadingEl = document.getElementById('loading');

    // ページ描画処理
    const renderPage = num => {
        pageIsRendering = true;

        pdfDoc.getPage(num).then(page => {
            const viewport = page.getViewport({ scale: scale });
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
                canvasContext: ctx,
                viewport: viewport
            };

            const renderTask = page.render(renderContext);

            renderTask.promise.then(() => {
                pageIsRendering = false;
                loadingEl.classList.add('hidden');

                if (pageNumIsPending !== null) {
                    renderPage(pageNumIsPending);
                    pageNumIsPending = null;
                }
            });
        });

        // UI情報の更新
        document.getElementById('page-num').textContent = num;
        
        // ボタン状態の制御
        document.getElementById('prev-page').disabled = num <= 1;
        document.getElementById('next-page').disabled = num >= pdfDoc.numPages;
    };

    // キューに入れたページを表示
    const queueRenderPage = num => {
        if (pageIsRendering) {
            pageNumIsPending = num;
        } else {
            renderPage(num);
        }
    };

    // 前のページ
    document.getElementById('prev-page').addEventListener('click', () => {
        if (pageNum <= 1) return;
        pageNum--;
        queueRenderPage(pageNum);
    });

    // 次のページ
    document.getElementById('next-page').addEventListener('click', () => {
        if (pageNum >= pdfDoc.numPages) return;
        pageNum++;
        queueRenderPage(pageNum);
    });

    // PDFの読み込み
    pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
        pdfDoc = pdfDoc_;
        document.getElementById('page-count').textContent = pdfDoc.numPages;
        renderPage(pageNum);
    }).catch(err => {
        loadingEl.textContent = 'PDFの読み込みに失敗しました';
        console.error('Error: ' + err.message);
    });
</script>

</body>
</html>
